name: Dragon Ball Z - Budokai 3 (USA) (SLUS-20998)
# sha1 of the flat image: the ELF's one PT_LOAD segment (file offset 0x80, 0x370200 bytes), as configure.py cuts it.
sha1: 609fa60be86d0b2a2b73ecea158710524cea8bbd
options:
  basename: SLUS_209.98
  target_path: disc/SLUS_209.98.rom
  elf_path: build/SLUS_209.98.elf
  base_path: ..
  platform: ps2
  compiler: MWCCPS2

  # From .reginfo, and set by the startup code at 0x1001AC.
  gp_value: 0x00477CF0

  ld_script_path: build/SLUS_209.98.ld
  ld_dependencies: False
  ld_wildcard_sections: True
  ld_bss_contains_common: True

  create_asm_dependencies: False
  find_file_boundaries: False
  o_as_suffix: True

  symbol_addrs_path:
    - config/symbol_addrs.txt
    - config/symbols/lib_syscalls.txt
    - config/symbols/lib_strings.txt
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  asm_inc_header: |
    .set noat      /* allow manual use of $at */
    .set noreorder /* don't insert nops after branches */
  generated_macro_inc_content: |
    # VU0 macro-mode registers are written without the dollar sign by the disassembler.
    .set ACC, $ACC
    .set Q, $Q

  section_order: [".text", ".vutext", ".data", ".rodata", ".lit4", ".sdata", ".sbss", ".bss"]

segments:
  - name: cod
    type: code
    start: 0x000000
    vram: 0x00100000
    # .sbss + .bss: 0x470200 to 0x5D0100 (the startup code clears exactly that range).
    bss_size: 0x15FF00
    align: 128
    subsegments:
      # .text, 0x100000 to 0x310908 (padded to 0x310980). The four parts are inferred from the code's style
      # (docs/plan.md, "What is in the executable"): Metrowerks pads every function to 16 bytes and saves $s
      # registers with sq; Sony's and CRI's libraries (gcc) start functions on 8 bytes and save them with sd.
      - [0x000000, asm, sdk/text]       # Sony SDK libraries and the C library (gcc)
      - [0x02C360, asm, mw_a/text]      # Metrowerks code linked before CRI: amDraw3d.c, amMotion.c, ..., main
      - [0x04E5D0, asm, cri/text]       # CRI ADX / Sofdec middleware, libmtap (gcc)
      - [0x0A1E80, asm, mw_b/text]      # Metrowerks code linked after CRI: the game (and amMc.c, amCdFs.c)
      # .data, 0x310980 to 0x45CB80. The VU1 microprograms (DMA packets with VIF MPG) are kept as raw bytes.
      - [0x210980, bin, data/vu1_a]
      - [0x23E180, data, data/data_a]
      - [0x26F180, bin, data/vu1_b]
      - [0x285980, data, data/data_b]
      - [0x28BD80, bin, data/vu1_c]
      - [0x2B9D80, data, data/data_c]
      - [0x2EA980, bin, data/vu1_d]
      - [0x2EC580, data, data/data_d]
      # .rodata, 0x45CB80 to 0x46FD00: strings and constants in link order. Its last 0x80 bytes hold a static
      # initializer (code, 0x46FC80) and a pointer to it (0x46FCC0), as Metrowerks emits for a global whose
      # initial value is computed.
      - [0x35CB80, rodata, rodata/rodata]
      # .sdata, 0x46FD00 ($gp - 0x7FF0) to 0x470200.
      - [0x36FD00, sdata, sdata/sdata]
      - { type: bss, vram: 0x00470200 }
  - [0x370200]
