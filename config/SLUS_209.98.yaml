name: Dragon Ball Z - Budokai 3 (USA) (SLUS-20998)
# sha1 of the flat image: the ELF's one PT_LOAD segment (file offset 0x80, 0x370200 bytes), as configure.py cuts it.
sha1: 609fa60be86d0b2a2b73ecea158710524cea8bbd
options:
  basename: SLUS_209.98
  target_path: disc/SLUS_209.98.rom
  elf_path: build/SLUS_209.98.elf
  base_path: ..
  platform: ps2
  compiler: MWCCPS2

  # From .reginfo, and set by the startup code at 0x1001AC.
  gp_value: 0x00477CF0

  ld_script_path: build/SLUS_209.98.ld
  ld_dependencies: False
  ld_wildcard_sections: True
  ld_bss_contains_common: True
  # No SUBALIGN in the linker script: the gcc libraries start objects on 8-byte boundaries, which SUBALIGN(16)
  # would push to 16. Every object keeps its own section alignment instead.
  emit_subalign: False

  create_asm_dependencies: False
  find_file_boundaries: False
  o_as_suffix: True

  symbol_addrs_path:
    - config/symbol_addrs.txt
    - config/symbols/lib_syscalls.txt
    - config/symbols/lib_strings.txt
    - config/symbols/lib_sdk.txt
    - config/symbols/lib_cri.txt
    - config/symbols/sys.txt
    - config/symbols/battle.txt
    - config/symbols/menu.txt
    - config/symbols/story.txt
    - config/symbols/unk.txt
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  asm_inc_header: |
    .set noat      /* allow manual use of $at */
    .set noreorder /* don't insert nops after branches */
  generated_macro_inc_content: |
    # VU0 macro-mode registers are written without the dollar sign by the disassembler.
    .set ACC, $ACC
    .set Q, $Q

  section_order: [".text", ".vutext", ".data", ".rodata", ".lit4", ".sdata", ".sbss", ".bss"]

segments:
  - name: cod
    type: code
    start: 0x000000
    vram: 0x00100000
    # .sbss + .bss: 0x470200 to 0x5D0100 (the startup code clears exactly that range).
    bss_size: 0x15FF00
    align: 128
    subsegments:
      # .text, 0x100000 to 0x310908 (padded to 0x310980). The four parts are inferred from the code's style
      # (docs/plan.md, "What is in the executable"): Metrowerks pads every function to 16 bytes and saves $s
      # registers with sq; Sony's and CRI's libraries (gcc) start functions on 8 bytes and save them with sd.
      # Sony's SDK libraries and the C library (gcc; docs/plan.md, "The libraries' compilers"). One subsegment per
      # library (inferred: version strings and their data, error strings, the call graph, the register-save style);
      # not cut into objects yet. crt0 and the syscall stubs are hand-written assembly.
      - [0x000000, asm, sdk/crt0]
      - [0x000250, asm, sdk/libgraph]          # sceGsResetGraph ... (PsIIlibgraph 3000)
      - [0x001868, asm, sdk/libdma]            # "libdma: sync timeout"
      - [0x0020B0, asm, sdk/libmpeg]           # MPEG decoder strings; calls sceIpuInit
      - [0x009AF8, asm, sdk/libipu]            # sceIpuInit (0x109BD8) uses libipu's data
      - [0x009E40, asm, sdk/libkernl_syscalls] # `addiu $v1, N; syscall` stubs
      - [0x00A6E0, asm, sdk/libkernl]          # threads, kprintf, SIF RPC, file stubs, TLB, timers
      - [0x016550, asm, sdk/libpad]            # scePadInit: "libpad: Module version mismatch"
      - [0x017C10, asm, sdk/libsdr]            # "sceSdRemoteInit() RPC bind error!"
      - [0x0180F0, asm, sdk/libcdvd]           # the sceCd callback thread, N / S command semaphores
      - [0x019CB0, asm, sdk/libmc]             # "bind error libmc"
      # From here ee-gcc 2.96 (newlib and the compiler's runtime).
      - [0x01B4E8, asm, sdk/libm]              # double maths (constant tables in .rodata)
      - [0x01F620, asm, sdk/libgcc]            # __muldi3 (0x11F6E0), 64-bit division, soft double (dp-bit)
      - [0x0221A8, asm, sdk/libc]              # newlib: _close_r, rand, vfprintf, ...
      # Metrowerks code linked before CRI (amDraw3d.c, amMotion.c, ..., main). One subsegment per source file:
      # boundaries from the order of the files' data (scripts/find_files.py), names from the file-name strings the
      # code passes (unk_XXXXXX where none); both inferred.
      - [0x02C360, c, sys/unk_12C360]
      - [0x02C540, c, sys/unk_12C540]
      - [0x02DE80, c, sys/unk_12DE80]
      - [0x02EC10, c, sys/unk_12EC10]
      - [0x02EF80, c, sys/unk_12EF80]
      - [0x02FBA0, c, sys/amDraw3d]
      - [0x031700, c, sys/unk_131700]
      - [0x033620, c, sys/unk_133620]
      - [0x037440, c, sys/unk_137440]
      - [0x037EE0, c, sys/unk_137EE0]
      - [0x039DE0, c, sys/unk_139DE0]
      - [0x03AE80, c, sys/unk_13AE80]
      - [0x03B160, c, sys/amMotion]
      - [0x03DF20, c, sys/amObject]
      - [0x03FC20, c, sys/unk_13FC20]
      - [0x040890, c, sys/unk_140890]
      - [0x041230, c, sys/unk_141230]
      - [0x041280, c, sys/amSofdec]
      - [0x042AA0, c, sys/unk_142AA0]
      - [0x044CE0, c, sys/unk_144CE0]
      - [0x045490, c, sys/unk_145490]
      - [0x045B40, c, sys/unk_145B40]
      - [0x0461D0, c, sys/unk_1461D0]
      - [0x047560, c, sys/unk_147560]
      - [0x049E50, c, sys/script]
      # CRI ADX and Sofdec (ee-gcc 2.96). One subsegment per module: each starts at the first function whose own
      # error strings name that module (inferred); the functions between two such runs may belong to either.
      - [0x04E5D0, asm, cri/adx]               # ADXB, ADXF, ADXT, ADXRNA, ADXSTMF, ... (ADXT 9.19, ADXF 7.14)
      - [0x063EE8, asm, cri/srd]
      - [0x065180, asm, cri/dtr]               # DTR_ExecHndl
      - [0x065AD0, asm, cri/dtx]               # DTX_Create
      - [0x066480, asm, cri/dvci]              # dvCi* (CD/DVD file I/O)
      - [0x067FF8, asm, cri/htci]              # htCi* (host file I/O)
      - [0x069878, asm, cri/lsc]               # LSC_Create
      - [0x06A7F8, asm, cri/mfci]              # mfCi* (memory file I/O)
      - [0x06BBE0, asm, cri/ps2rna]            # PS2RNA_*
      - [0x06D9F8, asm, cri/sj]                # stream joints (no strings; SJX message at 0x16FAF0)
      - [0x06FEB0, asm, cri/svm]
      - [0x070800, asm, cri/mpv]               # no strings: CFT / M2V / MPS / MPV by their version strings' order
      - [0x07F1D0, asm, cri/mwsfd]             # MwsfdCrePrm, mwPly*, MWSFD_*
      - [0x087D90, asm, cri/sfd]               # SFD core (few strings)
      - [0x09EDD0, asm, cri/sfx]               # sfxcnv_*, SFX_*, SFXZ_*
      # libmtap: Sony's multitap library (ee-gcc 2.9-ee, like the SDK above), linked after CRI.
      - [0x0A19D0, c, sdk/libmtap]
      # Metrowerks code linked after CRI: the game, and amMc.c / amCdFs.c. Files as above.
      - [0x0A1E80, c, sys/amMc]
      - [0x0A31B0, c, unk/unk_1A31B0]
