name: Dragon Ball Z - Budokai 3 (USA) (SLUS-20998)
# sha1 of the flat image: the ELF's one PT_LOAD segment (file offset 0x80, 0x370200 bytes), as configure.py cuts it.
sha1: 609fa60be86d0b2a2b73ecea158710524cea8bbd
options:
  basename: SLUS_209.98
  target_path: disc/SLUS_209.98.rom
  elf_path: build/SLUS_209.98.elf
  base_path: ..
  platform: ps2
  compiler: MWCCPS2

  # From .reginfo, and set by the startup code at 0x1001AC.
  gp_value: 0x00477CF0

  ld_script_path: build/SLUS_209.98.ld
  ld_dependencies: False
  ld_wildcard_sections: True
  ld_bss_contains_common: True
  # No SUBALIGN in the linker script: the gcc libraries start objects on 8-byte boundaries, which SUBALIGN(16)
  # would push to 16. Every object keeps its own section alignment instead.
  emit_subalign: False

  create_asm_dependencies: False
  find_file_boundaries: False
  o_as_suffix: True

  symbol_addrs_path:
    - config/symbol_addrs.txt
    - config/symbols/lib_syscalls.txt
    - config/symbols/lib_strings.txt
    - config/symbols/lib_sdk.txt
    - config/symbols/lib_cri.txt
    - config/symbols/lib_names.txt
    - config/symbols/sys.txt
    - config/symbols/battle.txt
    - config/symbols/menu.txt
    - config/symbols/story.txt
    - config/symbols/unk.txt
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  asm_inc_header: |
    .set noat      /* allow manual use of $at */
    .set noreorder /* don't insert nops after branches */
  generated_macro_inc_content: |
    # VU0 macro-mode registers are written without the dollar sign by the disassembler.
    .set ACC, $ACC
    .set Q, $Q

  section_order: [".text", ".vutext", ".data", ".rodata", ".lit4", ".sdata", ".sbss", ".bss"]

segments:
  - name: cod
    type: code
    start: 0x000000
    vram: 0x00100000
    # .sbss + .bss: 0x470200 to 0x5D0100 (the startup code clears exactly that range).
    bss_size: 0x15FF00
    align: 128
    subsegments:
      # .text, 0x100000 to 0x310908 (padded to 0x310980). The four parts are inferred from the code's style
      # (docs/plan.md, "What is in the executable"): Metrowerks pads every function to 16 bytes and saves $s
      # registers with sq; Sony's and CRI's libraries (gcc) start functions on 8 bytes and save them with sd.
      # Sony's SDK libraries and the C library (gcc; docs/plan.md, "The libraries' compilers"). One subsegment per
      # library (inferred: version strings and their data, error strings, the call graph, the register-save style);
      # not cut into objects yet. crt0 and the syscall stubs are hand-written assembly.
      - [0x000000, c, sdk/crt0]
      - [0x000250, c, sdk/libgraph]          # sceGsResetGraph ... (PsIIlibgraph 3000)
      - [0x000940, c, sdk/libgraph/ico_graph005]
      - [0x000A08, c, sdk/libgraph/ico_graph006]
      - [0x000BF0, c, sdk/libgraph/ico_graph007]
      - [0x000CF8, c, sdk/libgraph_00100CF8]
      - [0x001868, c, sdk/libdma]            # "libdma: sync timeout"
      - [0x0019C0, c, sdk/libdma/kfiv_libdma]
      - [0x001CD8, c, sdk/libdma_00101CD8]
      - [0x0020B0, c, sdk/libmpeg]           # MPEG decoder strings; calls sceIpuInit
      - [0x004B28, asm, sdk/libmpeg_00104B28]           # hand-written MMI code with an inline data table
      - [0x004BE8, c, sdk/libmpeg_00104BE8]
      - [0x007BA0, c, sdk/libmpeg/kfiv_mpeg]
      - [0x0081F8, c, sdk/libmpeg_001081F8]
      - [0x0095C0, c, sdk/libmpeg/ico_init]
      - [0x0095D0, c, sdk/libmpeg_001095D0]
      - [0x009AF8, c, sdk/libipu]            # sceIpuInit (0x109BD8) uses libipu's data
      - [0x009E40, asm, sdk/libkernl_syscalls] # `addiu $v1, N; syscall` stubs
      - [0x00A6E0, c, sdk/libkernl]          # threads, kprintf, SIF RPC, file stubs, TLB, timers
      - [0x00A828, c, sdk/libkernl/ico_glue]
